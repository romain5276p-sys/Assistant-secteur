<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Assistant Secteur</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#f8fafc;
}

header{
  padding:18px;
  background:#111827;
  border-bottom:1px solid #334155;
  position:sticky;
  top:0;
  z-index:10;
}

h1{
  margin:0;
  font-size:22px;
}

.subtitle{
  margin-top:5px;
  color:#94a3b8;
  font-size:13px;
}

main{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.panel{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.panel h2{
  margin-top:0;
  font-size:18px;
}

.roleRow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button,select{
  border:none;
  border-radius:10px;
  padding:11px 12px;
  font-size:15px;
}

button{
  cursor:pointer;
  font-weight:bold;
}

.blue{
  background:#2563eb;
  color:white;
}

.green{
  background:#16a34a;
  color:white;
}

.orange{
  background:#ea580c;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.purple{
  background:#7c3aed;
  color:white;
}

.gray{
  background:#475569;
  color:white;
}

.machine{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
  border-left:7px solid #16a34a;
}

.machine.stop{
  border-left-color:#dc2626;
}

.machine.changeover{
  border-left-color:#f59e0b;
}

.machine.maintenance{
  border-left-color:#7c3aed;
}

.machine.priority{
  box-shadow:0 0 0 2px #facc15;
}

.machineTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.machineName{
  font-size:20px;
  font-weight:bold;
}

.status{
  font-size:13px;
  padding:6px 8px;
  border-radius:8px;
  background:#334155;
}

.detail{
  margin-top:10px;
  color:#cbd5e1;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.actions button{
  flex:1;
  min-width:130px;
}

.priorityBox{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.priorityLine{
  display:grid;
  grid-template-columns:45px 1fr;
  align-items:center;
  gap:8px;
}

.priorityLine strong{
  color:#facc15;
}

select{
  width:100%;
  background:#334155;
  color:white;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  padding:15px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modalBox{
  width:100%;
  max-width:500px;
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}

.modalBox h2{
  margin-top:0;
}

.causeButton{
  display:block;
  width:100%;
  margin:7px 0;
  background:#334155;
  color:white;
  text-align:left;
}

.historyItem{
  border-bottom:1px solid #334155;
  padding:10px 0;
  font-size:14px;
}

.historyTime{
  color:#94a3b8;
  font-size:12px;
  margin-top:3px;
}

.empty{
  color:#94a3b8;
  text-align:center;
  padding:20px 5px;
}

.managerOnly{
  display:none;
}

.notice{
  background:#422006;
  border:1px solid #a16207;
  color:#fde68a;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
}

footer{
  text-align:center;
  padding:20px;
  color:#64748b;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>Assistant Secteur</h1>
  <div class="subtitle">
    Secteur meulage • 5 machines
  </div>
</header>

<main>

<div id="errorBox" class="notice"></div>

<section class="panel">
  <h2>Mon rôle</h2>

  <div class="roleRow">
    <button class="blue" onclick="setRole('Opérateur 1')">
      Opérateur 1
    </button>

    <button class="blue" onclick="setRole('Régleur')">
      Régleur
    </button>

    <button class="purple" onclick="setRole('Responsable')">
      Responsable
    </button>
  </div>

  <div style="margin-top:10px;color:#94a3b8">
    Connecté comme :
    <strong id="roleLabel"></strong>
  </div>
</section>

<section id="managerPanel" class="panel managerOnly">

  <h2>Priorités secteur</h2>

  <div class="priorityBox">

    <div class="priorityLine">
      <strong>P1</strong>
      <select id="priority1"
        onchange="changePriority(0,this.value)">
      </select>
    </div>

    <div class="priorityLine">
      <strong>P2</strong>
      <select id="priority2"
        onchange="changePriority(1,this.value)">
      </select>
    </div>

    <div class="priorityLine">
      <strong>P3</strong>
      <select id="priority3"
        onchange="changePriority(2,this.value)">
      </select>
    </div>

  </div>

</section>

<section>
  <div id="machines"></div>
</section>

<section id="managerJobs" class="panel managerOnly">
  <h2>Interventions en cours</h2>
  <div id="jobs"></div>
</section>

<section class="panel">
  <h2>Historique</h2>
  <div id="history"></div>
</section>

</main>

<footer>
Assistant Secteur • Version locale stable
</footer>


<div id="stopModal" class="modal">

  <div class="modalBox">

    <h2>Déclarer un arrêt</h2>

    <div id="stopMachineName"
         style="margin-bottom:12px;color:#94a3b8">
    </div>

    <div id="causeList"></div>

    <button
      class="gray"
      style="width:100%;margin-top:10px"
      onclick="closeStopModal()">
      Annuler
    </button>

  </div>

</div>


<script>
"use strict";

/* ================================
   CONFIGURATION
================================ */

const STORAGE_KEY = "assistantSecteurStableV1";

const DEFAULT_MACHINES = [
  {id:1,name:"Machine 1"},
  {id:2,name:"Machine 2"},
  {id:3,name:"Machine 3"},
  {id:4,name:"Machine 4"},
  {id:5,name:"Machine 5"}
];

const CAUSES = [
  "Changement de série",
  "Retouche robot / meulage",
  "Changement de meule",
  "Appro box vide",
  "Évacuation box plein",
  "En attente de pièce",
  "Panne capteur",
  "Panne inondation / manque d’eau",
  "Perte de pièce en cours",
  "Réunion",
  "Autre"
];


/* ================================
   ÉTAT PAR DÉFAUT
================================ */

function createDefaultState(){

  return {

    role:"Opérateur 1",

    priorities:[1,2,3],

    machines:DEFAULT_MACHINES.map(m=>({
      id:m.id,
      name:m.name,
      state:"run",
      cause:"",
      assigned:"",
      handling:"waiting",
      startedAt:null
    })),

    history:[]

  };

}


/* ================================
   CHARGEMENT SÉCURISÉ
================================ */

function loadState(){

  try{

    const raw=localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return createDefaultState();
    }

    const parsed=JSON.parse(raw);

    if(
      !parsed ||
      !Array.isArray(parsed.machines) ||
      parsed.machines.length!==5
    ){
      return createDefaultState();
    }

    if(!Array.isArray(parsed.priorities)){
      parsed.priorities=[1,2,3];
    }

    if(!Array.isArray(parsed.history)){
      parsed.history=[];
    }

    if(!parsed.role){
      parsed.role="Opérateur 1";
    }

    return parsed;

  }catch(error){

    console.error("Erreur chargement :",error);

    return createDefaultState();

  }

}

let S=loadState();

let activeMachineId=null;


/* ================================
   OUTILS
================================ */

function $(id){
  return document.getElementById(id);
}

function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(S)
    );

  }catch(error){

    console.error("Erreur sauvegarde :",error);

  }

}

function timestamp(){

  return new Date().toLocaleString(
    "fr-FR",
    {
      day:"2-digit",
      month:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function logEvent(text){

  S.history.unshift({
    text:text,
    time:timestamp()
  });

  if(S.history.length>100){
    S.history=S.history.slice(0,100);
  }

}


/* ================================
   RÔLE
================================ */

function setRole(role){

  S.role=role;

  save();

  render();

}


/* ================================
   PRIORITÉS
================================ */

function changePriority(position,value){

  const machineId=Number(value);

  S.priorities[position]=machineId;

  /*
    Empêche une même machine
    d'être présente plusieurs fois.
  */

  S.priorities=S.priorities.filter(
    (id,index,array)=>
      array.indexOf(id)===index
  );

  for(const machine of S.machines){

    if(S.priorities.length>=3){
      break;
    }

    if(!S.priorities.includes(machine.id)){
      S.priorities.push(machine.id);
    }

  }

  logEvent(
    "Priorités modifiées : "+
    S.priorities
      .map((id,i)=>
        "P"+(i+1)+" Machine "+id
      )
      .join(" • ")
  );

  save();

  render();

}


/* ================================
   ARRÊTS
================================ */

function openStopModal(id){

  activeMachineId=id;

  const machine=S.machines.find(
    m=>m.id===id
  );

  if(!machine){
    return;
  }

  $("stopMachineName").textContent=
    machine.name;

  const container=$("causeList");

  container.innerHTML="";

  CAUSES.forEach(cause=>{

    const button=document.createElement("button");

    button.className="causeButton";

    button.textContent=cause;

    button.onclick=function(){
      declareStop(cause);
    };

    container.appendChild(button);

  });

  $("stopModal").classList.add("show");

}

function closeStopModal(){

  $("stopModal").classList.remove("show");

  activeMachineId=null;

}

function declareStop(cause){

  const machine=S.machines.find(
    m=>m.id===activeMachineId
  );

  if(!machine){
    closeStopModal();
    return;
  }

  machine.state=
    cause==="Changement de série"
      ?"changeover"
      :"stop";

  machine.cause=cause;

  machine.startedAt=Date.now();

  machine.assigned="";

  machine.handling="waiting";

  logEvent(
    machine.name+
    " : arrêt déclaré — "+
    cause
  );

  closeStopModal();

  save();

  render();

}


/* ================================
   PRISE EN CHARGE
================================ */

function takeJob(id){

  const machine=S.machines.find(
    m=>m.id===id
  );

  if(!machine){
    return;
  }

  machine.assigned=S.role;

  machine.handling="taken";

  logEvent(
    machine.name+
    " pris en charge par "+
    S.role
  );

  save();

  render();

}

function requestMaintenance(id){

  const machine=S.machines.find(
    m=>m.id===id
  );

  if(!machine){
    return;
  }

  machine.handling="maintenance";

  machine.assigned="Maintenance";

  logEvent(
    "Maintenance demandée sur "+
    machine.name
  );

  save();

  render();

}


/* ================================
   RESPONSABLE
================================ */

function managerAssign(id,person){

  const machine=S.machines.find(
    m=>m.id===id
  );

  if(!machine){
    return;
  }

  machine.assigned=person;

  machine.handling="assigned";

  logEvent(
    machine.name+
    " attribuée à "+
    person
  );

  save();

  render();

}

function managerMaintenance(id){

  const machine=S.machines.find(
    m=>m.id===id
  );

  if(!machine){
    return;
  }

  machine.assigned="Maintenance";

  machine.handling="maintenance";

  logEvent(
    machine.name+
    " orientée vers maintenance"
  );

  save();

  render();

}


/* ================================
   REDÉMARRAGE
================================ */

function resolveMachine(id){

  const machine=S.machines.find(
    m=>m.id===id
  );

  if(!machine){
    return;
  }

  logEvent(
    machine.name+
    " : problème résolu / machine repartie"
  );

  machine.state="run";

  machine.cause="";

  machine.assigned="";

  machine.handling="waiting";

  machine.startedAt=null;

  save();

  render();

}


/* ================================
   AFFICHAGE RÔLE
================================ */

function renderRole(){

  const label=$("roleLabel");

  if(label){
    label.textContent=S.role;
  }

  const manager=
    S.role==="Responsable";

  document
    .querySelectorAll(".managerOnly")
    .forEach(element=>{

      element.style.display=
        manager?"block":"none";

    });

}


/* ================================
   AFFICHAGE PRIORITÉS
================================ */

function renderPriorities(){

  for(let i=0;i<3;i++){

    const select=$(
      "priority"+(i+1)
    );

    if(!select){
      continue;
    }

    select.innerHTML="";

    S.machines.forEach(machine=>{

      const option=
        document.createElement("option");

      option.value=machine.id;

      option.textContent=
        machine.name;

      if(
        S.priorities[i]===
        machine.id
      ){
        option.selected=true;
      }

      select.appendChild(option);

    });

  }

}


/* ================================
   AFFICHAGE MACHINES
================================ */

function renderMachines(){

  const container=$("machines");

  if(!container){
    return;
  }

  container.innerHTML="";

  S.machines.forEach(machine=>{

    const card=
      document.createElement("div");

    let cardClass="machine";

    if(machine.state==="stop"){
      cardClass+=" stop";
    }

    if(machine.state==="changeover"){
      cardClass+=" changeover";
    }

    if(machine.handling==="maintenance"){
      cardClass+=" maintenance";
    }

    if(S.priorities.includes(machine.id)){
      cardClass+=" priority";
    }

    card.className=cardClass;

    let status="EN MARCHE";

    if(machine.state==="stop"){
      status="ARRÊT";
    }

    if(machine.state==="changeover"){
      status="CHGT SÉRIE";
    }

    const priorityIndex=
      S.priorities.indexOf(machine.id);

    const priority=
      priorityIndex>=0
        ?"P"+(priorityIndex+1)
        :"";

    const top=
      document.createElement("div");

    top.className="machineTop";

    const name=
      document.createElement("div");

    name.className="machineName";

    name.textContent=
      machine.name+
      (priority?" • "+priority:"");

    const statusElement=
      document.createElement("div");

    statusElement.className="status";

    statusElement.textContent=status;

    top.appendChild(name);
    top.appendChild(statusElement);

    card.appendChild(top);


    if(machine.state!=="run"){

      const detail=
        document.createElement("div");

      detail.className="detail";

      detail.textContent=
        machine.cause || "Arrêt";

      if(machine.assigned){

        detail.textContent+=
          " • "+machine.assigned;

      }

      card.appendChild(detail);

    }


    const actions=
      document.createElement("div");

    actions.className="actions";


    if(machine.state==="run"){

      const stopButton=
        document.createElement("button");

      stopButton.className="red";

      stopButton.textContent=
        "Déclarer arrêt";

      stopButton.onclick=function(){
        openStopModal(machine.id);
      };

      const changeButton=
        document.createElement("button");

      changeButton.className="orange";

      changeButton.textContent=
        "Changement de série";

      changeButton.onclick=function(){

        activeMachineId=machine.id;

        declareStop(
          "Changement de série"
        );

      };

      actions.appendChild(stopButton);
      actions.appendChild(changeButton);

    }else{

      if(S.role!=="Responsable"){

        const takeButton=
          document.createElement("button");

        takeButton.className="blue";

        takeButton.textContent=
          "Je prends en charge";

        takeButton.onclick=function(){
          takeJob(machine.id);
        };

        const maintenanceButton=
          document.createElement("button");

        maintenanceButton.className="purple";

        maintenanceButton.textContent=
          "Demande maintenance";

        maintenanceButton.onclick=function(){
          requestMaintenance(machine.id);
        };

        actions.appendChild(takeButton);
        actions.appendChild(
          maintenanceButton
        );

      }


      if(S.role==="Responsable"){

        const resolveButton=
          document.createElement("button");

        resolveButton.className="green";

        resolveButton.textContent=
          "Machine repartie";

        resolveButton.onclick=function(){
          resolveMachine(machine.id);
        };

        actions.appendChild(resolveButton);

      }

    }

    card.appendChild(actions);

    container.appendChild(card);

  });

}


/* ================================
   INTERVENTIONS RESPONSABLE
================================ */

function renderJobs(){

  const container=$("jobs");

  if(!container){
    return;
  }

  container.innerHTML="";

  const active=S.machines.filter(
    m=>m.state!=="run"
  );

  if(active.length===0){

    container.innerHTML=
      '<div class="empty">'+
      'Aucun arrêt à traiter.'+
      '</div>';

    return;

  }

  active.forEach(machine=>{

    const box=
      document.createElement("div");

    box.className="historyItem";

    const title=
      document.createElement("strong");

    title.textContent=
      machine.name+
      " — "+
      machine.cause;

    box.appendChild(title);

    const actions=
      document.createElement("div");

    actions.className="actions";

    const op=
      document.createElement("button");

    op.className="blue";

    op.textContent="Opérateur 1";

    op.onclick=function(){
      managerAssign(
        machine.id,
        "Opérateur 1"
      );
    };

    const reg=
      document.createElement("button");

    reg.className="blue";

    reg.textContent="Régleur";

    reg.onclick=function(){
      managerAssign(
        machine.id,
        "Régleur"
      );
    };

    const maintenance=
      document.createElement("button");

    maintenance.className="purple";

    maintenance.textContent=
      "Maintenance";

    maintenance.onclick=function(){
      managerMaintenance(
        machine.id
      );
    };

    actions.appendChild(op);
    actions.appendChild(reg);
    actions.appendChild(maintenance);

    box.appendChild(actions);

    container.appendChild(box);

  });

}


/* ================================
   HISTORIQUE
================================ */

function renderHistory(){

  const container=$("history");

  if(!container){
    return;
  }

  container.innerHTML="";

  if(S.history.length===0){

    container.innerHTML=
      '<div class="empty">'+
      'Aucun événement enregistré.'+
      '</div>';

    return;

  }

  S.history
    .slice(0,30)
    .forEach(event=>{

      const item=
        document.createElement("div");

      item.className="historyItem";

      const text=
        document.createElement("div");

      text.textContent=event.text;

      const time=
        document.createElement("div");

      time.className="historyTime";

      time.textContent=event.time;

      item.appendChild(text);
      item.appendChild(time);

      container.appendChild(item);

    });

}


/* ================================
   RENDU CENTRAL
================================ */

function render(){

  try{

    renderRole();

    renderPriorities();

    renderMachines();

    renderJobs();

    renderHistory();

    save();

  }catch(error){

    console.error(
      "Erreur render :",
      error
    );

    const box=$("errorBox");

    if(box){

      box.style.display="block";

      box.textContent=
        "Erreur d’affichage : "+
        error.message;

    }

  }

}


/* ================================
   SÉCURITÉ MODALE
================================ */

$("stopModal").addEventListener(
  "click",
  function(event){

    if(event.target===this){
      closeStopModal();
    }

  }
);


/* ================================
   DÉMARRAGE
================================ */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    render();

  }
);

</script>

</body>
</html>
