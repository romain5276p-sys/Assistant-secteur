<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Assistant Secteur — V1</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#070b14; --panel:#0e1526; --panel2:#121b31; --line:#22304e;
      --text:#f4f7fb; --muted:#95a3bd; --ok:#20c77a; --warn:#ffb020;
      --danger:#ff5d6c; --accent:#4e8cff; --prio:#ff6b3d;
      --shadow:0 10px 25px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#070b14 0%,#0a1020 100%);
      color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .app{max-width:820px;margin:auto;min-height:100vh;padding:18px 14px 96px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
    h1{font-size:23px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px}
    .badge{background:#14213c;border:1px solid #273a61;color:#b9ccff;padding:8px 10px;border-radius:999px;font-size:12px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0 18px}
    .metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
    .metric strong{font-size:22px;display:block}.metric span{font-size:11px;color:var(--muted)}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
    .section-title h2{font-size:16px;margin:0}.hint{font-size:11px;color:var(--muted)}
    .machines{display:grid;gap:10px}
    .machine{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .machine.priority{border-color:#6d3b2d}
    .machine.priority:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--prio)}
    .machine-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .name{font-weight:750;font-size:16px}.meta{color:var(--muted);font-size:12px;margin-top:3px}
    .status{font-size:12px;font-weight:700;padding:7px 9px;border-radius:999px;white-space:nowrap}
    .running{background:rgba(32,199,122,.13);color:#77e2ad;border:1px solid rgba(32,199,122,.35)}
    .stopped{background:rgba(255,93,108,.13);color:#ff9aa4;border:1px solid rgba(255,93,108,.35)}
    .prio-tag{display:inline-flex;margin-top:10px;padding:5px 8px;border-radius:8px;background:rgba(255,107,61,.12);color:#ffb09a;font-size:11px;border:1px solid rgba(255,107,61,.28)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    button{border:0;border-radius:11px;padding:11px 12px;font-weight:700;font-size:13px;cursor:pointer}
    .btn-stop{background:#2a1420;color:#ffadb5;border:1px solid #5a2734}
    .btn-start{background:#113224;color:#90e8bd;border:1px solid #245d43}
    .btn-secondary{background:#16213a;color:#c9d6ef;border:1px solid #2a3a5e}
    .btn-primary{background:var(--accent);color:white}
    .priority-box{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px}
    .priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    select,input{width:100%;background:#0a1120;color:var(--text);border:1px solid #2b3b60;border-radius:10px;padding:11px;font-size:13px}
    .alert{display:none;margin:0 0 14px;background:#2a1f10;border:1px solid #684c1d;color:#ffd494;padding:12px;border-radius:12px;font-size:13px}
    .alert.show{display:block}
    .history{display:grid;gap:8px}
    .event{background:#0b1221;border:1px solid #1f2b47;border-radius:12px;padding:10px 12px;font-size:12px}
    .event time{color:var(--muted);display:block;font-size:10px;margin-top:3px}
    .empty{color:var(--muted);font-size:12px;padding:10px 2px}
    nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,11,20,.94);backdrop-filter:blur(12px);border-top:1px solid #1d2944;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
    .navinner{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .navinner button{background:#121b31;color:#b7c6df;border:1px solid #263654}
    .navinner button.active{background:#1d3158;color:#fff;border-color:#3f69aa}
    .view{display:none}.view.active{display:block}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
    .modal.show{display:flex}.sheet{width:min(820px,100%);background:#0e1526;border:1px solid #2a395c;border-radius:18px 18px 14px 14px;padding:16px}
    .sheet h3{margin:0 0 12px}.sheet .row{display:grid;gap:9px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Assistant Secteur</h1>
      <div class="sub">Secteur meulage automatisé • V1</div>
    </div>
    <div class="badge">Mode local</div>
  </header>

  <div id="priorityAlert" class="alert"></div>

  <section id="viewSecteur" class="view active">
    <div class="summary">
      <div class="metric"><strong id="mRun">0</strong><span>En marche</span></div>
      <div class="metric"><strong id="mStop">0</strong><span>À l'arrêt</span></div>
      <div class="metric"><strong id="mPrio">3</strong><span>Prioritaires</span></div>
    </div>

    <div class="section-title"><h2>Machines du secteur</h2><span class="hint">État en temps réel sur cet appareil</span></div>
    <div id="machines" class="machines"></div>
  </section>

  <section id="viewResponsable" class="view">
    <div class="section-title"><h2>Priorités du secteur</h2><span class="hint">Responsable</span></div>
    <div class="priority-box">
      <div class="sub" style="margin-bottom:10px">Choisis les 3 machines à traiter en priorité.</div>
      <div class="priority-grid">
        <select id="p1"></select><select id="p2"></select><select id="p3"></select>
      </div>
      <button id="savePrio" class="btn-primary" style="width:100%;margin-top:10px">Appliquer les priorités</button>
    </div>

    <div class="section-title"><h2>Historique récent</h2><button id="clearHistory" class="btn-secondary">Effacer</button></div>
    <div id="history" class="history"></div>
  </section>
</div>

<nav>
  <div class="navinner">
    <button id="tabSecteur" class="active">Secteur</button>
    <button id="tabResponsable">Responsable</button>
  </div>
</nav>

<div id="stopModal" class="modal">
  <div class="sheet">
    <h3>Déclarer un arrêt</h3>
    <div class="row">
      <input id="stopMachine" type="text" disabled />
      <select id="reason">
        <option value="Réglage">Réglage</option>
        <option value="Panne">Panne</option>
        <option value="Qualité">Qualité / non-conformité</option>
        <option value="Manque matière">Manque matière</option>
        <option value="Outillage">Outillage / meule</option>
        <option value="Autre">Autre</option>
      </select>
      <input id="comment" type="text" placeholder="Commentaire facultatif" />
    </div>
    <div class="sheet-actions">
      <button id="cancelStop" class="btn-secondary">Annuler</button>
      <button id="confirmStop" class="btn-stop">Déclarer l'arrêt</button>
    </div>
  </div>
</div>

<script>
const defaultState = {
  machines: [
    {id:1,name:"Machine 1",detail:"BERGER 1",running:true,reason:""},
    {id:2,name:"Machine 2",detail:"BERGER 2",running:true,reason:""},
    {id:3,name:"Machine 3",detail:"BERGER 3",running:true,reason:""},
    {id:4,name:"Machine 4",detail:"BERGER 4",running:true,reason:""},
    {id:5,name:"Machine 5",detail:"SIEPMANN",running:true,reason:""}
  ],
  priorities:[1,2,3],
  history:[]
};
let state = JSON.parse(localStorage.getItem("assistantSecteurV1") || "null") || defaultState;
let activeStopId = null;

function save(){ localStorage.setItem("assistantSecteurV1", JSON.stringify(state)); }
function now(){ return new Date().toLocaleString("fr-FR",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}); }
function addEvent(text){
  state.history.unshift({text,time:now()});
  state.history = state.history.slice(0,30);
  save();
}
function render(){
  const wrap=document.getElementById("machines"); wrap.innerHTML="";
  state.machines.forEach(m=>{
    const isP=state.priorities.includes(m.id);
    const card=document.createElement("div");
    card.className="machine"+(isP?" priority":"");
    const prioIndex=state.priorities.indexOf(m.id)+1;
    card.innerHTML=`
      <div class="machine-top">
        <div><div class="name">${m.name}</div><div class="meta">${m.detail}</div></div>
        <div class="status ${m.running?'running':'stopped'}">${m.running?'EN MARCHE':'ARRÊT'}</div>
      </div>
      ${isP?`<div class="prio-tag">Priorité n°${prioIndex}</div>`:""}
      ${!m.running?`<div class="meta" style="margin-top:8px">Motif : ${m.reason||"Non renseigné"}</div>`:""}
      <div class="actions">
        ${m.running
          ? `<button class="btn-stop" onclick="openStop(${m.id})">Déclarer un arrêt</button>`
          : `<button class="btn-start" onclick="restart(${m.id})">Remettre en marche</button>`}
        <button class="btn-secondary" onclick="togglePriorityQuick(${m.id})">${isP?'Prioritaire ✓':'Mettre prioritaire'}</button>
      </div>`;
    wrap.appendChild(card);
  });
  document.getElementById("mRun").textContent=state.machines.filter(m=>m.running).length;
  document.getElementById("mStop").textContent=state.machines.filter(m=>!m.running).length;
  fillPrioritySelects();
  renderHistory();
}
function fillPrioritySelects(){
  ["p1","p2","p3"].forEach((id,i)=>{
    const s=document.getElementById(id); s.innerHTML="";
    state.machines.forEach(m=>{
      const o=document.createElement("option"); o.value=m.id; o.textContent=m.name+" — "+m.detail;
      if(state.priorities[i]===m.id)o.selected=true; s.appendChild(o);
    });
  });
}
function openStop(id){
  activeStopId=id;
  const m=state.machines.find(x=>x.id===id);
  document.getElementById("stopMachine").value=m.name+" — "+m.detail;
  document.getElementById("comment").value="";
  document.getElementById("stopModal").classList.add("show");
}
function restart(id){
  const m=state.machines.find(x=>x.id===id); m.running=true; m.reason="";
  addEvent(`${m.name} remise en marche`);
  save(); render();
}
function togglePriorityQuick(id){
  if(state.priorities.includes(id)){
    alert("Une machine prioritaire se change depuis l'onglet Responsable.");
    return;
  }
  state.priorities[2]=id;
  addEvent(`Priorités modifiées : ${priorityNames().join(" > ")}`);
  flashPriorityAlert();
  save(); render();
}
function priorityNames(){ return state.priorities.map(id=>state.machines.find(m=>m.id===id)?.name||""); }
function flashPriorityAlert(){
  const a=document.getElementById("priorityAlert");
  a.textContent="⚠ Priorités mises à jour : "+priorityNames().join(" → ");
  a.classList.add("show");
  setTimeout(()=>a.classList.remove("show"),6000);
}
function renderHistory(){
  const h=document.getElementById("history");
  if(!state.history.length){h.innerHTML='<div class="empty">Aucun événement pour le moment.</div>';return;}
  h.innerHTML=state.history.map(e=>`<div class="event">${e.text}<time>${e.time}</time></div>`).join("");
}

document.getElementById("cancelStop").onclick=()=>document.getElementById("stopModal").classList.remove("show");
document.getElementById("confirmStop").onclick=()=>{
  const m=state.machines.find(x=>x.id===activeStopId);
  const reason=document.getElementById("reason").value;
  const comment=document.getElementById("comment").value.trim();
  m.running=false; m.reason=reason+(comment?` — ${comment}`:"");
  addEvent(`${m.name} arrêtée : ${m.reason}`);
  document.getElementById("stopModal").classList.remove("show");
  save(); render();
};
document.getElementById("savePrio").onclick=()=>{
  const vals=["p1","p2","p3"].map(id=>Number(document.getElementById(id).value));
  if(new Set(vals).size<3){ alert("Choisis 3 machines différentes."); return; }
  state.priorities=vals;
  addEvent(`Priorités modifiées : ${priorityNames().join(" > ")}`);
  flashPriorityAlert();
  save(); render();
};
document.getElementById("clearHistory").onclick=()=>{state.history=[];save();renderHistory();};
document.getElementById("tabSecteur").onclick=()=>switchView("secteur");
document.getElementById("tabResponsable").onclick=()=>switchView("responsable");
function switchView(v){
  document.getElementById("viewSecteur").classList.toggle("active",v==="secteur");
  document.getElementById("viewResponsable").classList.toggle("active",v==="responsable");
  document.getElementById("tabSecteur").classList.toggle("active",v==="secteur");
  document.getElementById("tabResponsable").classList.toggle("active",v==="responsable");
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
render();
</script>
</body>
</html>
