<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><link rel="manifest" href="manifest.json"><title>Assistant Secteur V1.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#f5f7fb;font-family:system-ui}.app{max-width:760px;margin:auto;padding:18px 14px 85px}h1{font-size:23px;margin:0}.sub{color:#91a0ba;font-size:12px;margin:3px 0 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card,.panel{background:#0e1628;border:1px solid #22304d;border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:#91a0ba}h2{font-size:15px;margin:18px 2px 9px}.list{display:grid;gap:9px}.card{position:relative}.prio{border-left:4px solid #ff7548}.top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.meta{color:#91a0ba;font-size:11px}.status{font-size:10px;font-weight:800;padding:6px 8px;border-radius:99px;height:max-content}.run{background:#123326;color:#83e4b5}.stop{background:#351923;color:#ffabb5}.maint{background:#352a13;color:#ffda8b}.taken{background:#172b4d;color:#bcd1ff}.tag{display:inline-block;margin-top:8px;font-size:10px;color:#ffb49d}.issue{font-size:12px;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}button,select{padding:10px;border-radius:10px;border:1px solid #2c3d61;background:#16223c;color:#dce7fb;font-weight:700}.red{background:#311722;color:#ffadb6}.green{background:#123326;color:#90e8bd}.blue{background:#407de8;color:white}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid3 select{min-width:0}.panel>.blue{width:100%;margin-top:8px}.view{display:none}.view.active{display:block;animation:a .2s ease}@keyframes a{from{opacity:.2;transform:translateX(10px)}}nav{position:fixed;bottom:0;left:0;right:0;background:#080d18ee;border-top:1px solid #22304d;padding:9px}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}.activeTab{background:#1d345d}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:flex-end;padding:10px}.modal.show{display:flex}.sheet{background:#10192d;border:1px solid #2a3c61;border-radius:18px;padding:15px;width:min(760px,100%);margin:auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.choices button{min-height:50px}.wide{grid-column:1/-1}.assign{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:9px}.event{font-size:11px;background:#0b1323;border:1px solid #1d2a46;border-radius:10px;padding:9px}.event small{display:block;color:#91a0ba;margin-top:3px}
</style></head><body><div class="app"><h1>Assistant Secteur</h1><div class="sub">Secteur meulage automatisé • V1.1</div>
<section id="vs" class="view active"><div class="stats"><div class="stat"><b id="nr">5</b><span>En marche</span></div><div class="stat"><b id="ns">0</b><span>À l'arrêt</span></div><div class="stat"><b>3</b><span>Prioritaires</span></div></div><h2>Machines du secteur</h2><div id="machines" class="list"></div></section>
<section id="vr" class="view"><h2>Priorités</h2><div class="panel"><div class="grid3"><select id="p1"></select><select id="p2"></select><select id="p3"></select></div><button id="savep" class="blue">Appliquer les priorités</button></div><h2>Interventions en cours</h2><div id="jobs" class="list"></div><h2>Historique</h2><div id="hist" class="list"></div></section></div>
<nav><div class="nav"><button id="bs" class="activeTab">Secteur</button><button id="br">Responsable</button></div></nav>
<div id="modal" class="modal"><div class="sheet"><b id="mt">Déclarer un arrêt</b><div id="mc" class="choices"></div></div></div>
<script>
const D={machines:["BERGER 1","BERGER 2","BERGER 3","BERGER 4","SIEPMANN"].map((x,i)=>({id:i+1,name:"Machine "+(i+1),detail:x,state:"run",cause:"",handling:"",assigned:""})),priorities:[1,2,3],history:[]};
let S=JSON.parse(localStorage.getItem("AS11")||"null")||D,active=0,cause="";
const causes=["Perte de pièce","Défaut capteur","Problème réglage","Meule / brossage","Robot / préhenseur","Évacuation","Autre"],people=["Non affecté","Opérateur 1","Opérateur 2","Régleur","Responsable"];
function save(){localStorage.setItem("AS11",JSON.stringify(S))}function log(t){S.history.unshift({t,d:new Date().toLocaleString("fr-FR")});S.history=S.history.slice(0,20);save()}
function st(m){if(m.state==="run")return["EN MARCHE","run"];if(m.handling==="maintenance")return["MAINTENANCE","maint"];if(m.handling==="taken")return["PRIS EN CHARGE","taken"];return["ARRÊT","stop"]}
function render(){
  const w=document.querySelector("#machines");
  w.innerHTML=S.machines.map(m=>{
    const q=st(m), p=S.priorities.indexOf(m.id)+1;
    const issue=m.state!=="run" ? `<div class="issue"><b>${m.cause}</b>${m.assigned?" • "+m.assigned:""}</div>` : "";
    let actions="";
    if(m.state==="run"){
      actions=`<button class="red" onclick="openStop(${m.id})">Déclarer un arrêt</button><button onclick="quick(${m.id})">${p?"Prioritaire ✓":"Mettre prioritaire"}</button>`;
    }else{
      actions=`<button class="green" onclick="resolve(${m.id})">Problème résolu</button>`;
      actions+=m.handling==="maintenance" ? `<button disabled>Maintenance demandée</button>` : `<button onclick="take(${m.id})">Je prends</button>`;
    }
    return `<div class="card ${p?"prio":""}"><div class="top"><div><div class="name">${m.name}</div><div class="meta">${m.detail}</div></div><span class="status ${q[1]}">${q[0]}</span></div>${p?`<span class="tag">Priorité n°${p}</span>`:""}${issue}<div class="actions">${actions}</div></div>`;
  }).join("");
  nr.textContent=S.machines.filter(m=>m.state==="run").length;
  ns.textContent=5-Number(nr.textContent);
  fill();jobs();hist();
}
function fill(){["p1","p2","p3"].forEach((x,i)=>document.getElementById(x).innerHTML=S.machines.map(m=>`<option value="${m.id}" ${S.priorities[i]===m.id?"selected":""}>${m.name}</option>`).join(""))}
function openStop(id){active=id;mt.textContent="Arrêt — "+S.machines.find(m=>m.id===id).name;mc.innerHTML=causes.map(c=>`<button onclick="pick('${c}')">${c}</button>`).join("")+`<button class="wide" onclick="closeM()">Annuler</button>`;modal.classList.add("show")}
function pick(c){cause=c;mt.textContent="Qui doit intervenir ?";mc.innerHTML=`<button class="green" onclick="confirmS('team')">Équipe peut prendre en charge</button><button class="red" onclick="confirmS('maintenance')">Maintenance nécessaire</button><button class="wide" onclick="openStop(${active})">← Retour</button>`}
function confirmS(h){let m=S.machines.find(x=>x.id===active);m.state="stop";m.cause=cause;m.handling=h==="maintenance"?"maintenance":"waiting";m.assigned="";log(`${m.name} — ${cause} — ${h==="maintenance"?"maintenance demandée":"équipe peut intervenir"}`);closeM();render()}
function closeM(){modal.classList.remove("show")}function take(id){let m=S.machines.find(x=>x.id===id);m.handling="taken";m.assigned=m.assigned||"Opérateur";log(`${m.name} prise en charge par ${m.assigned}`);render()}
function resolve(id){let m=S.machines.find(x=>x.id===id);log(`${m.name} remise en marche`);Object.assign(m,{state:"run",cause:"",handling:"",assigned:""});render()}
function quick(id){if(S.priorities.includes(id))return alert("Modifie les priorités dans le mode Responsable.");S.priorities[2]=id;log("Priorités modifiées");render()}
function jobs(){let a=S.machines.filter(m=>m.state!=="run");document.querySelector("#jobs").innerHTML=a.length?a.map(m=>`<div class="card"><div class="top"><div><b>${m.name}</b><div class="issue">${m.cause}</div></div><span class="status ${st(m)[1]}">${st(m)[0]}</span></div><div class="assign"><select id="a${m.id}">${people.map(p=>`<option ${m.assigned===p?"selected":""}>${p}</option>`).join("")}</select><button class="blue" onclick="assign(${m.id})">Affecter</button></div></div>`).join(""):`<div class="meta">Aucun arrêt en cours.</div>`}
function assign(id){let m=S.machines.find(x=>x.id===id),v=document.getElementById("a"+id).value;m.assigned=v==="Non affecté"?"":v;if(m.assigned)m.handling="taken";log(`${m.name} affectée à ${m.assigned||"personne"}`);render()}
function hist(){document.querySelector("#hist").innerHTML=S.history.length?S.history.map(e=>`<div class="event">${e.t}<small>${e.d}</small></div>`).join(""):`<div class="meta">Aucun événement.</div>`}
savep.onclick=()=>{let v=["p1","p2","p3"].map(x=>+document.getElementById(x).value);if(new Set(v).size<3)return alert("Choisis 3 machines différentes.");S.priorities=v;log("Priorités modifiées");render()}
function tab(r){vs.classList.toggle("active",!r);vr.classList.toggle("active",r);bs.classList.toggle("activeTab",!r);br.classList.toggle("activeTab",r)}bs.onclick=()=>tab(false);br.onclick=()=>tab(true);modal.onclick=e=>{if(e.target===modal)closeM()};if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});render();
</script></body></html>
