<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <title>Assistant Secteur - V0</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#111827;
      --panel2:#172033;
      --text:#f8fafc;
      --muted:#94a3b8;
      --green:#22c55e;
      --orange:#f59e0b;
      --red:#ef4444;
      --blue:#3b82f6;
      --line:#243044;
      --star:#facc15;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
    }
    .app{max-width:520px;margin:0 auto;padding:16px 14px 32px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .title{font-weight:800;font-size:20px}
    .role{
      border:1px solid var(--line);background:var(--panel);color:var(--text);
      padding:8px 10px;border-radius:12px;font-size:13px
    }
    .hint{color:var(--muted);font-size:13px;margin-bottom:14px}
    .priority-wrap{
      display:flex;gap:8px;align-items:center;margin-bottom:14px;
      background:var(--panel);padding:10px 12px;border-radius:14px
    }
    .priority-wrap span{font-size:13px;color:var(--muted)}
    .priority-list{font-weight:700;color:var(--star)}
    .machine{
      background:var(--panel);border:1px solid var(--line);border-radius:16px;
      padding:13px 14px;margin-bottom:10px;display:grid;
      grid-template-columns:48px 1fr auto;gap:10px;align-items:center;
    }
    .machine.priority{outline:2px solid rgba(250,204,21,.35)}
    .machine-name{font-size:18px;font-weight:800}
    .star{color:var(--star);font-size:18px;cursor:pointer;user-select:none}
    .status-line{display:flex;align-items:center;gap:8px;font-weight:700}
    .dot{width:11px;height:11px;border-radius:50%}
    .green{background:var(--green)} .orange{background:var(--orange)} .red{background:var(--red)}
    .meta{font-size:12px;color:var(--muted);margin-top:4px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button{
      border:0;border-radius:11px;padding:9px 11px;font-weight:800;cursor:pointer
    }
    .btn-stop{background:var(--red);color:white}
    .btn-take{background:var(--orange);color:#111827}
    .btn-start{background:var(--green);color:#06210f}
    .btn-secondary{background:#243044;color:var(--text)}
    .section-title{font-size:14px;color:var(--muted);margin:20px 0 8px}
    .history{
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      overflow:hidden
    }
    .history-item{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}
    .history-item:last-child{border-bottom:0}
    .empty{color:var(--muted);padding:14px}
    dialog{
      width:min(92vw,420px);border:1px solid var(--line);border-radius:18px;
      background:var(--panel);color:var(--text);padding:16px
    }
    dialog::backdrop{background:rgba(0,0,0,.65)}
    .reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .reason{background:var(--panel2);color:var(--text);padding:12px 8px}
    .modal-footer{display:flex;justify-content:flex-end;margin-top:12px}
    .small{font-size:12px;color:var(--muted)}
    .toast{
      position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
      background:#020617;color:#fff;border:1px solid var(--line);
      padding:10px 14px;border-radius:12px;display:none;z-index:20;
      max-width:92vw;text-align:center
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="title">SECTEUR</div>
      <div class="small" id="clock"></div>
    </div>
    <select id="role" class="role">
      <option value="manager">Responsable</option>
      <option value="operator">Opérateur / Régleur</option>
    </select>
  </div>

  <div class="hint">Vue instantanée des 5 machines. Les ★ indiquent les priorités de production.</div>

  <div class="priority-wrap">
    <span>Priorités :</span>
    <div class="priority-list" id="priorityList">—</div>
  </div>

  <div id="machines"></div>

  <div class="section-title">Historique récent</div>
  <div class="history" id="history"></div>
</div>

<dialog id="stopDialog">
  <h3 id="dialogTitle">Déclarer un arrêt</h3>
  <div class="small">Choisis le motif. Le chrono démarre immédiatement.</div>
  <div class="reasons" id="reasons"></div>
  <div class="modal-footer">
    <button class="btn-secondary" onclick="stopDialog.close()">Annuler</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const reasons = [
  "Changement de série",
  "Retouche robot / meulage",
  "Changement de meule",
  "Appro box vide",
  "Évac box plein",
  "En attente de pièce",
  "Panne capteur",
  "Inondation / manque d’eau",
  "Perte de pièce",
  "Réunion",
  "Autre"
];

const defaultMachines = Array.from({length:5}, (_,i)=>({
  id:"M"+(i+1), status:"production", reason:"", since:null, taken:false
}));

let state = JSON.parse(localStorage.getItem("atelierState") || "null") || {
  machines: defaultMachines,
  priorities:["M1","M3","M4"],
  history:[]
};

let selectedMachine = null;
const roleSel = document.getElementById("role");
const machinesEl = document.getElementById("machines");
const historyEl = document.getElementById("history");
const priorityList = document.getElementById("priorityList");
const stopDialog = document.getElementById("stopDialog");
const reasonsEl = document.getElementById("reasons");
const toastEl = document.getElementById("toast");

function save(){ localStorage.setItem("atelierState", JSON.stringify(state)); }

function statusLabel(m){
  if(m.status==="production") return ["PRODUCTION","green"];
  if(m.taken) return [m.reason.toUpperCase(),"orange"];
  return [m.reason.toUpperCase(),"red"];
}

function elapsed(ts){
  if(!ts) return "";
  const sec = Math.max(0, Math.floor((Date.now()-ts)/1000));
  const mm = String(Math.floor(sec/60)).padStart(2,"0");
  const ss = String(sec%60).padStart(2,"0");
  return `${mm}:${ss}`;
}

function render(){
  priorityList.textContent = state.priorities.length ? state.priorities.join(" • ") : "aucune";
  machinesEl.innerHTML="";
  state.machines.forEach(m=>{
    const isPrio = state.priorities.includes(m.id);
    const [label,color] = statusLabel(m);
    const card = document.createElement("div");
    card.className = "machine"+(isPrio?" priority":"");
    card.innerHTML = `
      <div>
        <div class="star" data-star="${m.id}">${isPrio?"★":"☆"}</div>
        <div class="machine-name">${m.id}</div>
      </div>
      <div>
        <div class="status-line"><span class="dot ${color}"></span>${label}</div>
        <div class="meta">${m.status==="production" ? "Machine disponible" : `Arrêt depuis ${elapsed(m.since)}${m.taken ? " • pris en charge" : ""}`}</div>
      </div>
      <div class="actions">
        ${m.status==="production"
          ? `<button class="btn-stop" data-stop="${m.id}">ARRÊT</button>`
          : `${!m.taken ? `<button class="btn-take" data-take="${m.id}">JE PRENDS</button>` : ""}
             <button class="btn-start" data-start="${m.id}">REPARTIE</button>`}
      </div>`;
    machinesEl.appendChild(card);
  });

  historyEl.innerHTML = state.history.length ? "" : `<div class="empty">Aucun événement pour l’instant.</div>`;
  state.history.slice(0,12).forEach(h=>{
    const div = document.createElement("div");
    div.className="history-item";
    div.textContent = `${h.time} • ${h.machine} • ${h.text}`;
    historyEl.appendChild(div);
  });

  document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>openStop(b.dataset.stop));
  document.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>take(b.dataset.take));
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>restart(b.dataset.start));
  document.querySelectorAll("[data-star]").forEach(s=>s.onclick=()=>togglePriority(s.dataset.star));
}

function openStop(id){
  selectedMachine=id;
  document.getElementById("dialogTitle").textContent=`${id} — Déclarer un arrêt`;
  reasonsEl.innerHTML="";
  reasons.forEach(r=>{
    const b=document.createElement("button");
    b.className="reason";
    b.textContent=r;
    b.onclick=()=>declareStop(id,r);
    reasonsEl.appendChild(b);
  });
  stopDialog.showModal();
}

function declareStop(id, reason){
  const m=state.machines.find(x=>x.id===id);
  m.status="stopped"; m.reason=reason; m.since=Date.now(); m.taken=false;
  addHistory(id,`Arrêt déclaré : ${reason}`);
  save(); stopDialog.close(); render();
  toast(`${id} arrêté — ${reason}`);
}

function take(id){
  const m=state.machines.find(x=>x.id===id);
  m.taken=true;
  addHistory(id,"Arrêt pris en charge");
  save(); render();
  toast(`${id} pris en charge`);
}

function restart(id){
  const m=state.machines.find(x=>x.id===id);
  const duration = elapsed(m.since);
  addHistory(id,`Machine repartie après ${duration}`);
  m.status="production"; m.reason=""; m.since=null; m.taken=false;
  save(); render();
  toast(`${id} repassée en production`);
}

function togglePriority(id){
  if(roleSel.value!=="manager"){
    toast("Seul le responsable peut modifier les priorités.");
    return;
  }
  const i=state.priorities.indexOf(id);
  if(i>=0){
    state.priorities.splice(i,1);
  } else {
    if(state.priorities.length>=3){
      toast("Maximum 3 machines prioritaires.");
      return;
    }
    state.priorities.push(id);
  }
  addHistory(id,"Priorités secteur modifiées");
  save(); render();
  toast(`Priorités : ${state.priorities.join(" • ") || "aucune"}`);
}

function addHistory(machine,text){
  state.history.unshift({
    machine,text,
    time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})
  });
  state.history = state.history.slice(0,50);
}

function toast(msg){
  toastEl.textContent=msg; toastEl.style.display="block";
  setTimeout(()=>toastEl.style.display="none",1800);
}

setInterval(()=>{
  document.getElementById("clock").textContent =
    new Date().toLocaleString("fr-FR",{weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  render();
},1000);

roleSel.onchange=render;

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

render();
</script>
</body>
</html>
